<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ژانرها | ZINO ROMAN</title>
<link rel="icon" href="{{ url_for('static', filename='icon.jpg') }}">
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 min-height:100dvh;
 display:flex;
 flex-direction:column;
 background:#0b0614;
 color:#f2eaff;
 font-family:Tahoma,Arial,sans-serif;
 padding:
 max(16px,env(safe-area-inset-top))
 max(16px,env(safe-area-inset-right))
 max(16px,env(safe-area-inset-bottom))
 max(16px,env(safe-area-inset-left));
}
header,main,footer{
 width:100%;
 max-width:620px;
 margin-inline:auto;
}
header{
 display:flex;
 align-items:center;
 gap:12px;
 margin-bottom:18px;
}
h1{
 font-size:20px;
 color:#c39bff;
 margin:0;
}
a{color:#eadcff;text-decoration:none}
.back{
 padding:12px;
 border-radius:14px;
 background:#26103e;
}
.icons{
 display:flex;
 gap:8px;
 margin-inline-start:auto;
}
.icon{
 width:42px;
 height:42px;
 border:1px solid #583077;
 border-radius:14px;
 background:#1b0d2e;
 color:#eadcff;
 font-size:16px;
 cursor:pointer;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.genre{
 display:block;
 border-radius:18px;
 border:1px solid #583077;
 background:#1b0d2e;
 color:#f2eaff;
 text-decoration:none;
 overflow:hidden;
}
.cover{
 aspect-ratio:1/1;
 width:100%;
 object-fit:cover;
 display:block;
}
.info{
 padding:10px;
}
.name{
 font-size:13px;
 font-weight:bold;
 color:#d9c6ff;
 margin:0 0 4px;
}
.meta{
 font-size:11px;
 color:#a68abb;
}
footer{
 margin-top:auto;
 padding-top:22px;
 text-align:center;
 font-size:11px;
 line-height:1.8;
 color:#a68abb;
}
footer strong{color:#c39bff}
</style>
</head>
<body>
<header>
 <a class="back" href="/" aria-label="بازگشت">→</a>
 <h1>ژانرها</h1>
 <div class="icons">
  <button class="icon" aria-label="جست‌وجو" onclick="location.href='/search'">🔍</button>
  <button class="icon" aria-label="موزیک" onclick="window.open('/music','zinoMusic')">🎵</button>
  <button class="icon" aria-label="اعلانات" onclick="location.href='/notifications'">🔔</button>
 </div>
</header>

<main>
 <div class="grid" id="genreGrid"></div>
</main>

<footer>
 <strong>ZINO ROMAN</strong><br>
 تاریخ ساخت: 2026/11/09
</footer>

<script>
const genres = [
 {key:"love", name:"عشق و عاشقی", image:"love.jpg"},
 {key:"horror", name:"ترس و دلهره", image:"horror.jpg"},
 {key:"sad", name:"اشک و غمگین", image:"sad.jpg"},
 {key:"comedy", name:"کمدی و طنز", image:"comedy.jpg"},
 {key:"thriller", name:"هیجان و پلیسی", image:"thriller.jpg"},
 {key:"mystery", name:"ماجراجویی و معمایی", image:"mystery.jpg"}
];

const grid = document.getElementById("genreGrid");

genres.forEach(genre => {
 const link = document.createElement("a");
 link.className = "genre";
 link.href = `/genre-type?genre=${genre.key}`;

 const img = document.createElement("img");
 img.className = "cover";
 img.src = `/static/genres/${genre.image}`;
 img.alt = genre.name;

 const info = document.createElement("div");
 info.className = "info";

 const title = document.createElement("p");
 title.className = "name";
 title.textContent = genre.name;

 const meta = document.createElement("p");
 meta.className = "meta";
 meta.textContent = "۹ رمان";

 info.append(title, meta);
 link.append(img, info);
 grid.append(link);
});
</script>
</body>
</html>
