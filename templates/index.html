    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    color:#5b3a00;
  }

  .hero {
    flex:1;

    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px 0;

  .app-icon {
    width:82px;

    margin-bottom:16px;

  .app-title {

    font-weight:bold;

    background-clip:text;
    color:transparent;
    margin-bottom:10px;

  .quote {
    min-height:44px;
    color:#c9b6e6;
    font-size:14px;

    margin-bottom:24px;
    transition:opacity .4s ease;
  }

  .menu {
    width:100%;
    max-width:340px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .main-btn {
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    font-size:16px;
    font-weight:bold;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(90deg,#7b2ff7,#a55bff);
    box-shadow:0 10px 24px rgba(123,47,247,.35);

  .secondary-btn {
    width:100%;
    padding:14px;
    border-radius:16px;

  .reward-btn {

    border:1px solid rgba(245,179,1,.55);
    background:linear-gradient(90deg,rgba(245,179,1,.15),rgba(123,47,247,.15));

  .hidden {

  }

  .footer {
    margin-top:18px;
    text-align:center;
    font-size:11px;
    color:#8f7bb0;
    line-height:1.6;

  .footer strong {

.announcements {

      </svg>

<button class="premium-box" id="premiumBox" aria-label="اشتراک پرمیوم و فروشگاه سکه" onclick="location.href='/premium'">

<button class="icon-btn" aria-label="پروفایل" onclick="location.href='/profile'">

  <main class="hero">

    <p class="quote" id="quote">دنیای رمان‌ها را با سبکی شیک بخوان</p>

    <div class="menu">
<button class="main-btn" onclick="location.href='/genres'">ژانرها</button>
<button class="secondary-btn" onclick="location.href='/store'">فروشگاه زینو</button>
      <button class="reward-btn" id="dailyReward">دریافت سکهٔ روزانه</button>
<section class="announcements">
  <h2>اعلانات</h2>
  <div class="announcement-list" id="homeAnnouncements">
    <p style="font-size: 12px; color: #a68abb;">در حال بارگذاری اعلانات...</p>
  </div>
</section>

<script>
  // دریافت اعلانات از سرور
  document.addEventListener("DOMContentLoaded", async () => {
    const annContainer = document.getElementById("homeAnnouncements");
    
    try {
        const response = await fetch('/api/notices');
        if (!response.ok) throw new Error("خطا در اتصال");
        
        const notices = await response.json();
        
        if (notices.length === 0) {
            annContainer.innerHTML = '<p style="font-size: 12px; color: #a68abb;">هیچ اعلان جدیدی وجود ندارد.</p>';
            return;
        }
        
        let html = '';
        // نمایش اعلانات از جدید به قدیم
        notices.reverse().forEach(notice => {
            let bgColor = 'linear-gradient(135deg, #1b0d2e, #26103e)';
            let borderColor = '#583077';
            let titleColor = '#c39bff';
            let cursorStyle = 'default';
            let onclickAttr = '';
            
            if (notice.type === 'gift') {
                borderColor = '#c39bff';
                titleColor = '#ffd700';
            }
            
            // اگه لینک داشت، کلیک‌پذیر کن
            if (notice.link) {
                cursorStyle = 'pointer';
                onclickAttr = `onclick="location.href='${notice.link}'"`;
                // یه افکت هاور ملایم برای کلیک‌پذیری
                bgColor = 'linear-gradient(135deg, #26103e, #3a1760)';
            }
            
            html += `
                <div style="padding: 12px; background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 12px; margin-bottom: 8px; cursor: ${cursorStyle}; transition: transform 0.2s;" ${onclickAttr}>
                    <h3 style="color: ${titleColor}; font-size: 13px; margin: 0 0 6px 0; display: flex; justify-content: space-between;">
                        <span>${notice.title}</span>
                        ${notice.link ? '<span style="font-size: 10px; color: #a68abb;">مشاهده ←</span>' : ''}
                    </h3>
                    <p style="font-size: 12px; color: #cbb5e9; margin: 0; line-height: 1.6;">${notice.message}</p>
                    <span style="font-size: 10px; color: #a68abb; display: block; margin-top: 6px;">${notice.date}</span>
                </div>
            `;
        });
        
        annContainer.innerHTML = html;
        
        // اعطای هدیه در صورتی که اعلان هدیه وجود داشته باشد و کاربر قبلا نگرفته باشد
        const hasGift = notices.some(n => n.type === 'gift');
        if (hasGift && !localStorage.getItem("zino_gift_claimed")) {
            let currentCoins = Number(localStorage.getItem("zinoCoins") || 0);
            currentCoins += 100;
            localStorage.setItem("zinoCoins", currentCoins);
            localStorage.setItem("zino_gift_claimed", "true");
            // آپدیت هدر
            const coinEl = document.getElementById("coinCount");
            if (coinEl) coinEl.textContent = currentCoins;
        }
        
    } catch (e) {
        annContainer.innerHTML = '<p style="font-size: 12px; color: #ff5252;">خطا در دریافت اعلانات.</p>';
    }
  });
</script>
    </div>
  </main>
<button class="icon" aria-label="موزیک" onclick="window.open('/music','zinoMusic')">🎵</button>

  <footer class="footer">
    <strong>ZINO ROMAN</strong><br>
    تاریخ ساخت: 2026/11/09
  </footer>
<script>
(() => {
  const rewardButton = document.getElementById("dailyReward");
  const coinCount = document.getElementById("coinCount");
  const quoteElement = document.getElementById("quote");

  function todayKey() {
    return new Date().toDateString();
  }

  function getCoins() {
    const value = Number(localStorage.getItem("zinoCoins") || "0");
    return Number.isFinite(value) && value >= 0 ? value : 0;
  }

  function refreshReward() {
    const received =
      localStorage.getItem("zinoLastReward") === todayKey();

    if (coinCount) {
      coinCount.textContent = getCoins().toLocaleString("fa-IR");
    }

    if (rewardButton) {
      rewardButton.disabled = received;
      rewardButton.textContent = received
        ? "امروز دریافت شد"
        : "دریافت سکهٔ روزانه";
    }
  }

  if (rewardButton) {
    rewardButton.type = "button";

    rewardButton.addEventListener("click", () => {
      try {
        if (localStorage.getItem("zinoLastReward") === todayKey()) {
          refreshReward();
          return;
        }

        const newBalance = getCoins() + 50;

        localStorage.setItem("zinoCoins", String(newBalance));
        localStorage.setItem("zinoLastReward", todayKey());

        refreshReward();

        alert(
          "۵۰ سکه دریافت شد!\nموجودی: " +
          newBalance.toLocaleString("fa-IR") +
          " سکه"
        );
      } catch (error) {
        alert("ذخیرهٔ سکه ممکن نشد: " + error.message);
      }
    });
  }

  try {
    refreshReward();
  } catch (error) {
    if (rewardButton) {
      rewardButton.disabled = true;
      rewardButton.textContent = "ذخیره‌سازی مرورگر در دسترس نیست";
    }
  }

  window.addEventListener("pageshow", () => {
    try {
      refreshReward();
    } catch (error) {
      console.error(error);
    }
  });

  window.addEventListener("storage", () => {
    try {
      refreshReward();
    } catch (error) {
      console.error(error);
    }
  });

  const quotes = [
    "دنیای رمان‌ها را با سبکی شیک بخوان",
    "هر رمان، دنیایی تازه برای کشف کردن است",
    "از میان کلمات، به قصه‌های بی‌پایان سفر کن",
    "عشق، راز و ماجراجویی؛ همه در ZINO ROMAN",
    "لحظه‌ات را به یک داستان خوب بسپار",
    "رمان بعدی‌ات را همین‌جا پیدا کن"
  ];

  let quoteIndex = 0;

  if (quoteElement) {
    setInterval(() => {
      quoteElement.style.opacity = "0";

      setTimeout(() => {
        quoteIndex = (quoteIndex + 1) % quotes.length;
        quoteElement.textContent = quotes[quoteIndex];
        quoteElement.style.opacity = "1";
      }, 400);
    }, 5000);
  }
})();
</script>
</script>


<script>
(function checkInternet(){
    // نمایش پیام لودینگ اولیه
    const overlay = document.createElement('div');
    overlay.id = 'internetCheckOverlay';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0b0614;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #f2eaff;
        font-family: Tahoma, Arial, sans-serif;
        text-align: center;
        padding: 20px;
    `;
    overlay.innerHTML = `
        <div style="font-size: 50px; margin-bottom: 20px;">📡</div>
        <h2 style="color: #c39bff; margin-bottom: 10px;">در حال بررسی اینترنت...</h2>
        <p style="color: #a68abb; font-size: 14px;">لطفاً کمی صبر کنید</p>
    `;
    document.body.appendChild(overlay);

    // تابع بررسی اینترنت
    function testConnection() {
        return new Promise((resolve) => {
            // به یه فایل کوچیک از سرور خودمون یا گوگل وصل می‌شیم
            fetch('https://www.google.com/favicon.ico', { 
                mode: 'no-cors', 
                cache: 'no-cache',
                timeout: 5000 
            })
            .then(() => resolve(true))
            .catch(() => resolve(false));
        });
    }

    // بررسی با تایم اوت
    async function check() {
        const timeoutPromise = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('timeout')), 5000)
        );

        try {
            await Promise.race([testConnection(), timeoutPromise]);
            // اینترنت وصله، overlay رو حذف کن
            overlay.remove();
        } catch (e) {
            // اینترنت قطع است
            overlay.innerHTML = `
                <div style="font-size: 70px; margin-bottom: 20px;">📵</div>
                <h2 style="color: #ff5252; margin-bottom: 15px;">اینترنت شما قطع است</h2>
                <p style="color: #a68abb; font-size: 14px; margin-bottom: 25px; line-height: 1.8;">
                    لطفاً اتصال اینترنت خود را بررسی کرده و دوباره تلاش کنید.
                </p>
                <button onclick="location.reload()" style="
                    padding: 12px 30px;
                    border-radius: 14px;
                    border: none;
                    background: #7b2ff7;
                    color: white;
                    font-family: inherit;
                    font-size: 15px;
                    font-weight: bold;
                    cursor: pointer;
                ">🔄 تلاش مجدد</button>
            `;
        }
    }

    check();
})();
</script>
